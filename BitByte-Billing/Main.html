<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bit Byte Technologies — Billing & Quotation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #4F46E5;
  --primary-dark: #3730A3;
  --primary-light: #EEF2FF;
  --primary-mid: #818CF8;
  --secondary: #0F172A;
  --surface: #FFFFFF;
  --surface-2: #F8FAFC;
  --surface-3: #F1F5F9;
  --border: #E2E8F0;
  --border-2: #CBD5E1;
  --text-1: #0F172A;
  --text-2: #475569;
  --text-3: #94A3B8;
  --success: #10B981;
  --success-bg: #ECFDF5;
  --warning: #F59E0B;
  --warning-bg: #FFFBEB;
  --danger: #EF4444;
  --danger-bg: #FEF2F2;
  --info: #3B82F6;
  --info-bg: #EFF6FF;
  --orange: #F97316;
  --orange-bg: #FFF7ED;
  --purple: #8B5CF6;
  --purple-bg: #F5F3FF;
  --sidebar-w: 240px;
  --topbar-h: 64px;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 16px rgba(0,0,0,.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--surface-3);
  color: var(--text-1);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── AUTH ──────────────────────────────────── */
.auth-screen {
  min-height: 100vh;
  background: linear-gradient(135deg, #1e1b4b 0%, #312e81 40%, #4338ca 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.auth-card {
  background: white;
  border-radius: 20px;
  padding: 48px 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 25px 50px rgba(0,0,0,0.25);
}
.auth-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.auth-logo-icon {
  width: 42px; height: 42px; border-radius: 12px;
  background: linear-gradient(135deg, #4F46E5, #7C3AED);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800; color: white; letter-spacing: -1px;
}
.auth-logo span { font-size: 18px; font-weight: 800; color: var(--secondary); }
.auth-logo small { display: block; font-size: 11px; font-weight: 500; color: var(--text-3); letter-spacing: .5px; }
.auth-tagline { font-size: 22px; font-weight: 700; color: var(--secondary); margin-bottom: 4px; margin-top: 24px; }
.auth-sub { font-size: 13px; color: var(--text-2); margin-bottom: 28px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px 14px; border: 1.5px solid var(--border);
  border-radius: var(--radius); font-family: inherit; font-size: 14px; color: var(--text-1);
  background: var(--surface); transition: border-color .2s, box-shadow .2s; outline: none;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.12);
}
.form-group textarea { resize: vertical; min-height: 80px; }
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 10px 18px; border-radius: var(--radius); font-family: inherit;
  font-size: 13px; font-weight: 600; cursor: pointer; border: none;
  transition: all .18s; text-decoration: none; white-space: nowrap;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,70,229,.35); }
.btn-outline { background: white; color: var(--text-1); border: 1.5px solid var(--border-2); }
.btn-outline:hover { background: var(--surface-3); }
.btn-ghost { background: transparent; color: var(--text-2); border: none; }
.btn-ghost:hover { background: var(--surface-3); color: var(--text-1); }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-warning { background: var(--warning); color: white; }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-lg { padding: 13px 24px; font-size: 15px; width: 100%; justify-content: center; }
.btn-icon { padding: 8px; border-radius: 8px; background: var(--surface-3); color: var(--text-2); border: none; cursor: pointer; transition: all .15s; }
.btn-icon:hover { background: var(--border); color: var(--text-1); }
.role-pills { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.role-pill {
  flex: 1; min-width: 90px; padding: 10px 8px; border-radius: var(--radius); border: 2px solid var(--border);
  text-align: center; cursor: pointer; transition: all .15s; font-size: 12px; font-weight: 600; background: white;
}
.role-pill.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
.role-pill .icon { font-size: 20px; display: block; margin-bottom: 4px; }

/* ── LAYOUT ─────────────────────────────────── */
.app-layout { display: flex; min-height: 100vh; }
.sidebar {
  width: var(--sidebar-w); background: var(--secondary);
  position: fixed; top: 0; left: 0; height: 100vh;
  display: flex; flex-direction: column; z-index: 100;
  transition: transform .25s;
}
.sidebar-logo {
  padding: 20px 20px 16px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.sidebar-logo-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #6366F1, #8B5CF6);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 14px; color: white; letter-spacing: -1px; flex-shrink: 0;
}
.sidebar-logo-text { color: white; font-weight: 700; font-size: 14px; line-height: 1.2; }
.sidebar-logo-text small { display: block; font-size: 10px; font-weight: 400; color: rgba(255,255,255,.4); letter-spacing: .3px; }
.sidebar-role-badge {
  margin: 12px 16px; padding: 8px 12px; border-radius: 8px;
  background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
}
.sidebar-role-badge .rb-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,.35); font-weight: 600; }
.sidebar-role-badge .rb-name { font-size: 13px; font-weight: 600; color: white; margin-top: 2px; }
.sidebar-role-badge .rb-role { font-size: 11px; color: var(--primary-mid); font-weight: 500; }
.sidebar-nav { flex: 1; padding: 8px 10px; overflow-y: auto; }
.nav-section-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: rgba(255,255,255,.25); font-weight: 600; padding: 12px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px;
  border-radius: 8px; cursor: pointer; transition: all .15s; color: rgba(255,255,255,.6);
  font-size: 13px; font-weight: 500; margin-bottom: 2px; position: relative;
}
.nav-item:hover { background: rgba(255,255,255,.07); color: white; }
.nav-item.active { background: rgba(79,70,229,.35); color: white; }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 18px; background: var(--primary-mid); border-radius: 0 2px 2px 0;
}
.nav-item .nav-icon { font-size: 16px; flex-shrink: 0; }
.nav-badge {
  margin-left: auto; background: var(--danger); color: white;
  font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px;
}
.sidebar-footer {
  padding: 12px 10px; border-top: 1px solid rgba(255,255,255,.08);
}
.main-content {
  margin-left: var(--sidebar-w);
  flex: 1; display: flex; flex-direction: column; min-height: 100vh;
}
.topbar {
  height: var(--topbar-h); background: white; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 24px; gap: 16px;
  position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow);
}
.topbar-title { font-size: 16px; font-weight: 700; color: var(--text-1); flex: 1; }
.topbar-subtitle { font-size: 12px; color: var(--text-3); font-weight: 400; margin-top: 1px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.page-body { padding: 24px; flex: 1; }

/* ── CARDS ─────────────────────────────────── */
.card {
  background: white; border-radius: var(--radius-lg); border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.card-header {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title { font-size: 14px; font-weight: 700; color: var(--text-1); }
.card-body { padding: 20px; }

/* ── STAT CARDS ────────────────────────────── */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.stat-card {
  background: white; border-radius: var(--radius-lg); border: 1px solid var(--border);
  padding: 20px; box-shadow: var(--shadow);
}
.stat-label { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.stat-value { font-size: 26px; font-weight: 800; color: var(--text-1); letter-spacing: -1px; }
.stat-meta { font-size: 12px; color: var(--text-3); margin-top: 4px; }
.stat-badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 20px; margin-top: 6px; }
.stat-badge.up { background: var(--success-bg); color: var(--success); }
.stat-badge.down { background: var(--danger-bg); color: var(--danger); }
.stat-icon {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; margin-bottom: 12px;
}
.stat-icon.purple { background: var(--purple-bg); color: var(--purple); }
.stat-icon.blue { background: var(--info-bg); color: var(--info); }
.stat-icon.green { background: var(--success-bg); color: var(--success); }
.stat-icon.orange { background: var(--orange-bg); color: var(--orange); }

/* ── BADGE / STATUS ────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap;
}
.badge-draft { background: #F1F5F9; color: #475569; }
.badge-submitted { background: #EFF6FF; color: #2563EB; }
.badge-review { background: #FFF7ED; color: #C2410C; }
.badge-clarification { background: #FEF3C7; color: #92400E; }
.badge-forwarded { background: #EDE9FE; color: #6D28D9; }
.badge-approved { background: #ECFDF5; color: #065F46; }
.badge-rejected { background: #FEF2F2; color: #991B1B; }
.badge-paid { background: #ECFDF5; color: #065F46; }
.badge-pending { background: #FFF7ED; color: #C2410C; }
.badge-overdue { background: #FEF2F2; color: #991B1B; }
.badge-invoice { background: #EFF6FF; color: #1D4ED8; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

/* ── TABLE ─────────────────────────────────── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead tr { border-bottom: 2px solid var(--border); }
thead th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-3); white-space: nowrap; }
tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; }
tbody tr:hover { background: var(--surface-2); }
tbody tr:last-child { border-bottom: none; }
tbody td { padding: 12px 14px; color: var(--text-1); font-size: 13px; }
.mono { font-family: 'DM Mono', monospace; font-size: 12px; }
.action-btns { display: flex; align-items: center; gap: 4px; }

/* ── SEARCH & FILTER ───────────────────────── */
.search-bar {
  display: flex; align-items: center; gap: 8px; padding: 9px 12px;
  background: var(--surface-3); border: 1.5px solid var(--border); border-radius: var(--radius);
  flex: 1; max-width: 320px;
}
.search-bar input { border: none; background: none; outline: none; font-family: inherit; font-size: 13px; color: var(--text-1); flex: 1; }
.filter-row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.filter-select {
  padding: 8px 12px; border: 1.5px solid var(--border); border-radius: var(--radius);
  font-family: inherit; font-size: 13px; color: var(--text-1); background: white; outline: none; cursor: pointer;
}
.filter-select:focus { border-color: var(--primary); }

/* ── FORM / MODAL ──────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: white; border-radius: 20px; width: 100%;
  max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 60px rgba(0,0,0,.2);
}
.modal-sm { max-width: 440px; }
.modal-md { max-width: 600px; }
.modal-lg { max-width: 800px; }
.modal-xl { max-width: 960px; }
.modal-header {
  padding: 24px 28px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between;
}
.modal-title { font-size: 17px; font-weight: 700; color: var(--text-1); }
.modal-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
.modal-body { padding: 24px 28px; }
.modal-footer {
  padding: 16px 28px 24px; border-top: 1px solid var(--border);
  display: flex; gap: 10px; justify-content: flex-end;
}

/* ── STEPPER ───────────────────────────────── */
.stepper { display: flex; align-items: center; margin-bottom: 28px; }
.step {
  display: flex; align-items: center; gap: 8px; flex: 1; position: relative;
}
.step::after {
  content: ''; flex: 1; height: 2px; background: var(--border); margin: 0 8px;
}
.step:last-child::after { display: none; }
.step-num {
  width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0;
  border: 2px solid var(--border); background: white; color: var(--text-3);
}
.step.active .step-num { background: var(--primary); border-color: var(--primary); color: white; }
.step.done .step-num { background: var(--success); border-color: var(--success); color: white; }
.step.active::after { background: var(--primary); }
.step.done::after { background: var(--success); }
.step-label { font-size: 12px; font-weight: 600; color: var(--text-3); }
.step.active .step-label { color: var(--primary); }
.step.done .step-label { color: var(--success); }

/* ── SERVICE CARDS ─────────────────────────── */
.services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 16px 0; }
.service-card {
  border: 2px solid var(--border); border-radius: var(--radius-lg); padding: 18px;
  cursor: pointer; transition: all .18s; background: white; text-align: center;
  position: relative;
}
.service-card:hover { border-color: var(--primary-mid); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.service-card.selected { border-color: var(--primary); background: var(--primary-light); }
.service-card .check {
  position: absolute; top: 12px; right: 12px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--primary); color: white; display: flex; align-items: center; justify-content: center;
  font-size: 10px; opacity: 0; transition: opacity .15s;
}
.service-card.selected .check { opacity: 1; }
.service-icon { font-size: 28px; margin-bottom: 8px; }
.service-name { font-size: 13px; font-weight: 700; color: var(--text-1); }
.service-desc { font-size: 11px; color: var(--text-3); margin-top: 3px; line-height: 1.4; }

/* ── TIMELINE ──────────────────────────────── */
.timeline { list-style: none; }
.timeline-item { display: flex; gap: 12px; padding-bottom: 20px; position: relative; }
.timeline-item::before {
  content: ''; position: absolute; left: 15px; top: 28px; bottom: 0; width: 2px; background: var(--border);
}
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item:last-child::before { display: none; }
.tl-dot {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 13px; border: 2px solid var(--border);
  background: white; z-index: 1;
}
.tl-dot.primary { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.tl-dot.success { background: var(--success-bg); border-color: var(--success); color: var(--success); }
.tl-dot.warning { background: var(--warning-bg); border-color: var(--warning); color: var(--warning); }
.tl-dot.danger { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
.tl-content { flex: 1; }
.tl-title { font-size: 13px; font-weight: 600; color: var(--text-1); }
.tl-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.tl-body { font-size: 12px; color: var(--text-2); margin-top: 5px; background: var(--surface-2); padding: 8px 10px; border-radius: 8px; }

/* ── QUOTATION DETAIL ──────────────────────── */
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.detail-section { }
.detail-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-3); margin-bottom: 10px; }
.detail-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.detail-row:last-child { border-bottom: none; }
.detail-row .key { color: var(--text-2); font-weight: 500; }
.detail-row .val { color: var(--text-1); font-weight: 600; text-align: right; }
.summary-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
.summary-table th { padding: 8px 12px; background: var(--surface-3); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; font-weight: 700; color: var(--text-3); text-align: left; }
.summary-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
.summary-total { background: var(--primary-light); }
.summary-total td { padding: 10px 12px; font-weight: 700; color: var(--primary-dark); border-bottom: none; }

/* ── COSTING TABLE ─────────────────────────── */
.costing-row { display: grid; grid-template-columns: 1fr 1.5fr 100px 80px 100px 40px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
.costing-row.head { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-3); padding: 6px 0; }
.costing-total { display: flex; justify-content: flex-end; margin-top: 12px; }
.total-box { background: var(--primary-light); border: 1px solid rgba(79,70,229,.2); border-radius: var(--radius); padding: 12px 20px; text-align: right; }
.total-box .tl { font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.total-box .tv { font-size: 20px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }

/* ── INVOICE ───────────────────────────────── */
.invoice-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
.invoice-logo { font-size: 22px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
.invoice-meta { text-align: right; font-size: 13px; }
.invoice-section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text-3); margin-bottom: 8px; }
.invoice-items th { padding: 9px 12px; background: var(--secondary); color: white; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
.invoice-items td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.invoice-summary-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
.invoice-summary-row.total { font-size: 16px; font-weight: 800; padding-top: 10px; border-top: 2px solid var(--secondary); color: var(--secondary); }

/* ── CHART ─────────────────────────────────── */
.chart-container { position: relative; width: 100%; }
.donut-wrap { display: flex; align-items: center; gap: 20px; }
.donut-legend { display: flex; flex-direction: column; gap: 6px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* ── PAGES VISIBILITY ──────────────────────── */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100vh; }
.page { display: none; }
.page.active { display: block; }

/* ── GRID UTILS ────────────────────────────── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.flex-gap { display: flex; align-items: center; gap: 10px; }
.text-right { text-align: right; }
.text-muted { color: var(--text-3); }
.text-sm { font-size: 12px; }
.font-mono { font-family: 'DM Mono', monospace; font-size: 12px; }
.mt-4 { margin-top: 4px; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }

/* ── NOTIFICATION TOAST ────────────────────── */
.toast-container { position: fixed; top: 80px; right: 24px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: white; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 16px; box-shadow: var(--shadow-lg); min-width: 280px;
  display: flex; align-items: flex-start; gap: 10px; animation: slideIn .25s ease;
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--info); }
@keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast-icon { font-size: 16px; margin-top: 1px; }
.toast-msg { font-size: 13px; font-weight: 600; color: var(--text-1); }
.toast-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

/* ── RECENT ACTIVITY ───────────────────────── */
.activity-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: none; }
.activity-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.activity-content { flex: 1; }
.activity-text { font-size: 13px; color: var(--text-1); line-height: 1.4; }
.activity-text strong { font-weight: 700; }
.activity-time { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* ── PROFILE ───────────────────────────────── */
.profile-avatar {
  width: 80px; height: 80px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 800; color: white; letter-spacing: -2px;
  margin: 0 auto 16px;
}

/* ── PAGINATION ────────────────────────────── */
.pagination { display: flex; align-items: center; gap: 4px; }
.page-btn {
  width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border);
  background: white; font-size: 12px; font-weight: 600; color: var(--text-2);
  display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s;
}
.page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.page-btn:hover:not(.active) { background: var(--surface-3); }

/* ── NOTIFICATION BELL ─────────────────────── */
.notif-btn { position: relative; }
.notif-dot {
  position: absolute; top: 4px; right: 4px; width: 8px; height: 8px;

}

/* ── FILE ATTACHMENT ───────────────────────── */
.file-chip {

}
.file-chip:hover { background: var(--border); color: var(--text-1); }
.file-chip .size { color: var(--text-3); }

/* ── SCROLLBAR ─────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }

function fmt(n) { return '₹' + n.toLocaleString('en-IN'); }
function statusBadge(s) {

    'Needs Clarification': 'clarification', 'Forwarded to Admin': 'forwarded',
    'Approved': 'approved', 'Rejected': 'rejected', 'Paid': 'paid',
    'Pending': 'pending', 'Overdue': 'overdue', 'Invoice Generated': 'invoice',
  };
  return `<span class="badge badge-${map[s]||'draft'}">${s}</span>`;
}
function dotColor(s) {
  const map = { 'Draft': '#94A3B8', 'Submitted': '#3B82F6', 'Under Review': '#F97316', 'Needs Clarification': '#F59E0B', 'Forwarded to Admin': '#8B5CF6', 'Approved': '#10B981', 'Rejected': '#EF4444', 'Paid': '#10B981', 'Pending': '#F97316', 'Overdue': '#EF4444' };
  return map[s] || '#94A3B8';
}

function showToast(msg, sub, type = 'info') {
  const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
  const div = document.createElement('div');
  div.className = `toast ${type}`;
  div.innerHTML = `<span class="toast-icon">${icons[type]}</span><div><div class="toast-msg">${msg}</div><div class="toast-sub">${sub}</div></div>`;
  document.getElementById('toastContainer').appendChild(div);
  setTimeout(() => div.remove(), 3500);
}

function showModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = html;
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}

function closeModal() {
  document.querySelector('.modal-overlay')?.remove();
}

  const modal = `
  <div class="modal modal-xl">
    <div class="modal-header">
      <div>
        <div class="modal-title">Quotation ${q.id}</div>

    <div class="modal-body">
      <div class="detail-grid">
        <div>

        </div>
        <div>
          <div class="detail-label">Quotation Summary</div>
          ${hasCosting ? `
          <div class="detail-row"><span class="key">Sub Total</span><span class="val">${fmt(q.subtotal)}</span></div>

          <div class="detail-label mt-24">Project Description</div>

          <div class="detail-label mt-24">Attachments</div>

      ${hasCosting ? `
      <div class="mt-24">
        <div class="detail-label">Costing Breakdown</div>
        <table class="summary-table">
          <thead><tr><th>Service</th><th>Description</th><th class="text-right">Est. Cost (₹)</th><th class="text-right">GST (18%)</th><th class="text-right">Total (₹)</th></tr></thead>

      <div class="mt-24">

      ${currentRole === 'accountant' ? `
        <button class="btn btn-outline" onclick="showClarificationModal('${q.id}');closeModal()">Request Clarification</button>

      ` : ''}
      <button class="btn btn-outline" onclick="closeModal()">Close</button>
    </div>
  </div>`;
  showModal(modal);

function initQuotationWizard() {
  quotationDraft = { services: [], step: 1 };
  setTimeout(() => renderWizardStep(1), 50);
}

function renderWizardStep(step) {
  quotationDraft.step = step;
  const steps = [
    { n: 1, label: 'Services' },
    { n: 2, label: 'Requirements' },
    { n: 3, label: 'Summary' },
    { n: 4, label: 'Submit' },
  ];

  const stepperHtml = `
  <div class="stepper">
    ${steps.map(s => `
    <div class="step ${s.n < step ? 'done' : s.n === step ? 'active' : ''}">
      <div class="step-num">${s.n < step ? '✓' : s.n}</div>
      <span class="step-label">${s.label}</span>
    </div>`).join('')}
  </div>`;

  let content = '';
  if (step === 1) {
    content = `
    <div style="font-size:15px;font-weight:700;margin-bottom:4px">Select Services</div>
    <div style="font-size:13px;color:var(--text-3);margin-bottom:16px">Choose one or more services you are interested in</div>
    <div class="services-grid">
      ${SERVICES.map(s => `
      <div class="service-card ${quotationDraft.services.includes(s.id) ? 'selected' : ''}" onclick="toggleService('${s.id}', this)">
        <div class="check">✓</div>
        <div class="service-icon">${s.icon}</div>
        <div class="service-name">${s.name}</div>
        <div class="service-desc">${s.desc}</div>
      </div>`).join('')}
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px">
      <button class="btn btn-outline" onclick="showPage('dashboard')">Cancel</button>
      <button class="btn btn-primary" onclick="wizardNext()">Next →</button>
    </div>`;
  } else if (step === 2) {
    const selected = SERVICES.filter(s => quotationDraft.services.includes(s.id));
    content = `
    <div style="font-size:15px;font-weight:700;margin-bottom:4px">Service: ${selected.map(s=>s.name).join(', ')}</div>
    <div style="font-size:13px;color:var(--text-3);margin-bottom:20px">Tell us more about your project requirements</div>
    <div class="grid-2">
      <div>
        <div class="form-group"><label>Project Title *</label><input type="text" id="projTitle" placeholder="e.g. Corporate Website Development" value="${quotationDraft.projTitle||''}"></div>
        <div class="form-group"><label>Project Description *</label><textarea id="projDesc" placeholder="Describe your requirements…">${quotationDraft.projDesc||''}</textarea></div>
        <div class="form-group"><label>Preferred Start Date</label><input type="date" id="projDate" value="${quotationDraft.projDate||'2024-06-15'}"></div>
        <div class="form-group"><label>Budget Range (₹)</label>
          <select id="projBudget">
            <option ${quotationDraft.projBudget==='low'?'selected':''} value="low">₹20K – ₹50K</option>
            <option ${quotationDraft.projBudget==='mid'?'selected':''} value="mid">₹50K – ₹2L</option>
            <option ${quotationDraft.projBudget==='high'?'selected':''} value="high">₹2L – ₹5L</option>
            <option ${quotationDraft.projBudget==='enterprise'?'selected':''} value="enterprise">₹5L+</option>
          </select>
        </div>
      </div>
      <div>
        <div class="form-group"><label>Technology Preference</label><input type="text" id="projTech" placeholder="e.g. React, Node.js" value="${quotationDraft.projTech||''}"></div>
        <div class="form-group"><label>Priority Level</label>
          <select id="projPriority">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High" selected>High</option>
          </select>
        </div>
        <div class="form-group"><label>Attachments</label>
          <div style="border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;background:var(--surface-2)">

function toggleService(id, el) {
  const idx = quotationDraft.services.indexOf(id);
  if (idx > -1) { quotationDraft.services.splice(idx, 1); el.classList.remove('selected'); }
  else { quotationDraft.services.push(id); el.classList.add('selected'); }
}

function wizardNext() {
  if (!quotationDraft.services.length) { showToast('Please select at least one service', 'Choose a service to continue', 'error'); return; }
  renderWizardStep(2);
}

function saveStep2() {
  quotationDraft.projTitle = document.getElementById('projTitle')?.value || 'Corporate Website Development';
  quotationDraft.projDesc = document.getElementById('projDesc')?.value || 'A modern responsive website';
  quotationDraft.projDate = document.getElementById('projDate')?.value;
  quotationDraft.projBudget = document.getElementById('projBudget')?.value;
  quotationDraft.projTech = document.getElementById('projTech')?.value;
  quotationDraft.projPriority = document.getElementById('projPriority')?.value;
  renderWizardStep(3);
}

function submitQuotation() {
  const check = document.getElementById('confirmCheck');
  if (!check?.checked) { showToast('Please confirm the information', 'Check the confirmation box', 'error'); return; }
  showToast('Quotation submitted!', 'BBT-QT-2026-0013 — Under Review', 'success');
  setTimeout(() => showPage('quotations'), 1200);
}

function addCostingRow() {
  const row = document.createElement('div');
  row.className = 'costing-row';
  row.innerHTML = `
    <input type="text" placeholder="Service" style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px">
    <input type="text" placeholder="Description" style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px">
    <input type="number" placeholder="Cost" oninput="calcGst(this)" style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px">
    <input type="text" readonly placeholder="Auto" style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--surface-2)">
    <input type="text" readonly placeholder="Auto" style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--surface-2)">
    <button class="btn-icon" onclick="this.closest('.costing-row').remove()">🗑</button>`;
  document.getElementById('costingRows')?.appendChild(row);
}

function calcGst(input) {
  const row = input.closest('.costing-row');
  const inputs = row.querySelectorAll('input');
  const cost = parseFloat(input.value) || 0;
  const gst = Math.round(cost * 0.18);
  inputs[3].value = gst ? '₹' + gst.toLocaleString('en-IN') : '';
  inputs[4].value = gst ? '₹' + (cost + gst).toLocaleString('en-IN') : '';
}

function submitReview(qtId) {

  const msgs = { forward: 'Forwarded to Admin', clarify: 'Clarification Requested', draft: 'Saved as Draft' };
  showToast('Review submitted!', qtId + ' — ' + (msgs[action]||'Updated'), 'success');
  closeModal();
}

        </div>`).join('')}

function addClarPoint() {
  const pts = document.getElementById('clarPoints');
  const n = pts.children.length + 1;
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;align-items:flex-start';
  div.innerHTML = `<span style="font-size:13px;color:var(--text-3);min-width:20px">${n}.</span><input type="text" placeholder="Clarification point…" style="flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px"><button class="btn-icon btn-sm" onclick="this.parentElement.remove()">✕</button>`;
  pts?.appendChild(div);
}

function sendClarification(qtId) {

function initCharts() {
  setTimeout(() => {
    if (document.getElementById('statusDonut')) renderDonut('statusDonut', 'donutLegend');
    if (document.getElementById('revChart')) renderRevChart('revChart');
    if (document.getElementById('reportRevChart')) renderRevChart('reportRevChart');
    if (document.getElementById('reportStatusChart')) renderDonut('reportStatusChart', 'reportStatusLegend');
    if (document.getElementById('invStatusChart')) renderInvChart('invStatusChart');
  }, 100);
}

function renderDonut(canvasId, legendId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !window.Chart) return;
  const data = [
    { label: 'Draft', value: 10, color: '#94A3B8' },
    { label: 'Submitted', value: 29, color: '#3B82F6' },
    { label: 'Under Review', value: 32, color: '#F97316' },
    { label: 'Needs Clarification', value: 18, color: '#F59E0B' },
    { label: 'Approved', value: 40, color: '#10B981' },
    { label: 'Rejected', value: 14, color: '#EF4444' },
  ];
  new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels: data.map(d => d.label),
      datasets: [{ data: data.map(d => d.value), backgroundColor: data.map(d => d.color), borderWidth: 2, borderColor: '#fff' }]
    },
    options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, cutout: '68%' }
  });
  const leg = document.getElementById(legendId);
  if (leg) {
    leg.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:6px 14px">` +
      data.map(d => `<div style="display:flex;align-items:center;gap:5px;font-size:11px"><div style="width:8px;height:8px;border-radius:50%;background:${d.color};flex-shrink:0"></div><span style="color:var(--text-2)">${d.label}</span><span style="font-weight:700">(${d.value})</span></div>`).join('') +
      `</div>`;
  }
}

function renderRevChart(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !window.Chart) return;
  new Chart(canvas, {
    type: 'line',
    data: {
      labels: ['01 May','05 May','08 May','12 May','15 May','18 May','22 May','25 May','29 May'],
      datasets: [{
        label: 'Revenue',
        data: [80000,120000,95000,175000,145000,195000,160000,210000,240000],
        borderColor: '#4F46E5', backgroundColor: 'rgba(79,70,229,.08)',
        tension: 0.4, fill: true, pointRadius: 3, pointBackgroundColor: '#4F46E5'
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 11 }, color: '#94A3B8' } },
        y: { grid: { color: 'rgba(0,0,0,.05)' }, ticks: { font: { size: 11 }, color: '#94A3B8', callback: v => '₹' + (v/100000).toFixed(1) + 'L' } }
      }
    }
  });
}

function renderInvChart(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !window.Chart) return;
  new Chart(canvas, {
    type: 'bar',
    data: {
      labels: ['Paid','Pending','Overdue','Cancelled'],
      datasets: [{ data: [62, 28, 12, 2], backgroundColor: ['#10B981','#F97316','#EF4444','#94A3B8'], borderRadius: 6, borderSkipped: false }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 12 }, color: '#475569' } },
        y: { grid: { color: 'rgba(0,0,0,.05)' }, ticks: { font: { size: 11 }, color: '#94A3B8' } }
      }
    }
  });
}

// Hook into showPage to init charts
const _showPageOrig = showPage;
window.showPage = function(p) {
  _showPageOrig(p);
  initCharts();
};

// ══════════════════════════════════════════════════════════
//  TABLE FILTER
// ══════════════════════════════════════════════════════════
function filterQtTable(q) {
  const rows = document.querySelectorAll('#qtTable tbody tr');
  rows.forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}
function filterQtStatus(s) {
  const rows = document.querySelectorAll('#qtTable tbody tr');
  rows.forEach(r => {
    r.style.display = (!s || r.textContent.includes(s)) ? '' : 'none';
  });
}
